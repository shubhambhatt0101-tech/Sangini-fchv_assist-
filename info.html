<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partner With Us</title>
  <!-- Google Fonts for the editorial serif heading and clean sans-serif body -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Newsreader:opsz,wght@6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="firstpart.css">
</head>
<body>

  <main class="container">
    <section class="partner-section">
      <p class="eyebrow">PARTNER WITH US</p>
      
      <h1 class="heading">Partner with us to pilot in field settings.</h1>
      
      <p class="subtext">
        We are looking for NGOs, health programmes, and field partners to co-develop a pilot. If you work with frontline health workers, get in touch.
      </p>

      <form class="partner-form" action="#" method="POST">
        <!-- Name Input -->
        <div class="form-group">
          <label for="name">Name</label>
          <input 
            type="text" 
            id="name" 
            name="name" 
            placeholder="Your name or organisation" 
            required
          >
        </div>

        <!-- Email Input -->
        <div class="form-group">
          <label for="email">Contact email</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="you@organisation.org" 
            required
          >
        </div>

        <!-- Interactive Pill Selector (Radio buttons styled as buttons) -->
        <div class="form-group">
          <span class="group-label">How would you like to work together?</span>
          <div class="pill-group">
            <label class="pill-option">
              <input type="radio" name="collaboration_type" value="Request a demo">
              <span>Request a demo</span>
            </label>

            <label class="pill-option">
              <input type="radio" name="collaboration_type" value="NGO collaboration">
              <span>NGO collaboration</span>
            </label>

            <label class="pill-option">
              <input type="radio" name="collaboration_type" value="Pilot partnership">
              <span>Pilot partnership</span>
            </label>
          </div>
        </div>

        <!-- Message Textarea -->
        <div class="form-group">
          <label for="message">Message <span class="optional">(optional)</span></label>
          <textarea 
            id="message" 
            name="message" 
            rows="4" 
            placeholder="Tell us about your context: who you work with, where you operate."
          ></textarea>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="submit-btn">Send message</button>
      </form>
    </section>
  </main>

</body>
</html>
